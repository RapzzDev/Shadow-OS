<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<title>ShadowOS</title>

<style>
:root {
  --bg:#0b0e14;
  --panel:rgba(19,24,34,.94);
  --panel2:#171e2b;
  --line:rgba(190,205,230,.13);
  --text:#edf2fb;
  --muted:#96a2b7;
  --accent:#9bb7ed;
  --shadow:0 24px 70px #0009;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;font-size:14px}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}

#desktop{
  position:fixed;inset:0;
  background:
  radial-gradient(ellipse at 18% 20%,#283958 0,transparent 38%),
  radial-gradient(ellipse at 80% 78%,#172c35 0,transparent 40%),
  linear-gradient(135deg,#101722,#080b11 70%);
  background-size:cover;background-position:center;overflow:hidden;
}
.desktop-brand{position:absolute;top:30px;left:34px;pointer-events:none}
.desktop-brand strong{font-size:13px;letter-spacing:.28em}
.desktop-brand small{display:block;color:#aab7cc;margin-top:6px;font-size:10px;letter-spacing:.08em}

#desktopIcons{position:absolute;top:92px;left:25px;display:grid;gap:10px}
.desk-icon{
  border:0;background:transparent;width:76px;padding:9px 4px;
  border-radius:12px;display:grid;justify-items:center;gap:7px;color:white;
}
.desk-icon:hover{background:#ffffff12}
.desk-icon svg{width:28px;height:28px}
.desk-icon span{font-size:11px}

#taskbar{
  position:absolute;z-index:900;left:50%;bottom:13px;
  transform:translateX(-50%);height:58px;max-width:calc(100% - 22px);
  width:max-content;display:flex;align-items:center;gap:6px;padding:7px 10px;
  background:rgba(12,16,24,.86);border:1px solid #ffffff20;
  border-radius:18px;box-shadow:0 12px 35px #0008;
  backdrop-filter:blur(24px);
}
.task-app,.start-button{
  height:42px;min-width:42px;border:0;border-radius:12px;
  background:transparent;display:grid;place-items:center;position:relative;
}
.task-app svg,.start-button svg{width:21px;height:21px}
.task-app:hover,.start-button:hover{background:#ffffff14}
.task-app.active:after{
  content:"";position:absolute;bottom:2px;width:13px;height:3px;
  border-radius:5px;background:var(--accent);
}
.task-divider{height:28px;width:1px;background:#ffffff20;margin:0 3px}
.status{display:flex;align-items:center;gap:9px;padding:0 9px;color:#c7d2e5;font-size:11px}
.status button{border:0;background:none;padding:4px}
.status svg{width:15px;height:15px;vertical-align:middle}
.clock{font-size:11px;line-height:1.3;text-align:right}
.clock b{display:block;font-size:12px;color:white}

#startMenu,#quickPanel{
  position:absolute;z-index:950;background:rgba(15,20,30,.96);
  border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);backdrop-filter:blur(24px);display:none;
}
#startMenu{
  bottom:82px;left:50%;transform:translateX(-50%);
  width:min(430px,calc(100% - 24px));padding:18px;
}
#startMenu.show,#quickPanel.show{display:block}
.start-head{display:flex;justify-content:space-between;margin-bottom:15px}
.start-head strong{letter-spacing:.13em;font-size:12px}
.search,.field{
  width:100%;background:#0b1019;border:1px solid var(--line);
  border-radius:9px;padding:10px;color:white;outline:none;
}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.app-tile{
  border:0;background:transparent;border-radius:12px;padding:12px 4px;
  display:grid;justify-items:center;gap:8px;font-size:11px;
}
.app-tile:hover{background:#ffffff10}
.app-tile svg{width:25px;height:25px}

#quickPanel{right:15px;bottom:82px;width:280px;padding:15px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick-grid button{
  padding:12px 8px;border:1px solid var(--line);
  border-radius:10px;background:#ffffff0a;text-align:left;font-size:11px;
}

.window{
  position:absolute;z-index:20;min-width:280px;min-height:190px;
  width:590px;height:410px;max-width:calc(100vw - 20px);
  max-height:calc(100dvh - 95px);
  background:rgba(17,22,32,.97);border:1px solid #ffffff20;
  border-radius:15px;box-shadow:var(--shadow);
  backdrop-filter:blur(22px);overflow:hidden;display:flex;flex-direction:column;
}
.window.focused{border-color:#a8c1ed66;box-shadow:0 25px 75px #000a}
.window.maximized{
  left:10px!important;top:10px!important;
  width:calc(100vw - 20px)!important;
  height:calc(100dvh - 91px)!important;
}
.titlebar{
  height:43px;flex:0 0 43px;display:flex;align-items:center;
  justify-content:space-between;padding:0 12px 0 15px;
  background:#ffffff06;border-bottom:1px solid var(--line);
  cursor:grab;touch-action:none;user-select:none;
}
.titlebar:active{cursor:grabbing}
.window-title{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:650}
.window-title svg{width:16px;height:16px;color:#c1d2f1}
.win-actions{display:flex;gap:5px}
.win-actions button{
  border:0;background:transparent;width:25px;height:25px;
  border-radius:7px;color:#aebbd0;
}
.win-actions button:hover{background:#ffffff16}
.win-actions .close:hover{background:#a94350;color:white}
.window-content{flex:1;min-height:0;overflow:auto;padding:16px}
.resize-handle{
  position:absolute;right:0;bottom:0;width:17px;height:17px;
  cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#a9bde355 50%);
  touch-action:none;
}

.panel{background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:13px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:9px}
.between{justify-content:space-between}
.primary{
  background:#9bb7ed;color:#111927;border:0;
  border-radius:9px;padding:9px 13px;font-weight:650;
}
.secondary{
  background:#ffffff0d;color:#e8eef9;border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;
}
.section-title{font-size:11px;letter-spacing:.13em;color:#9daec8;text-transform:uppercase}

.calc{max-width:360px;margin:auto}
.calc-screen{
  background:#0b1018;border:1px solid var(--line);border-radius:12px;
  padding:16px;text-align:right;margin-bottom:12px;min-height:92px;
}
.calc-expression{color:#91a0b8;font-size:13px;min-height:20px;overflow-wrap:anywhere}
.calc-value{font-size:31px;font-weight:550;overflow-wrap:anywhere}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calc-grid button{
  height:54px;border:1px solid #ffffff0d;border-radius:10px;
  background:#ffffff0a;font-size:17px;
}
.calc-grid button:hover{background:#ffffff18}
.calc-grid .op{color:#c3d6fa;background:#9bb7ed18}
.calc-grid .equal{background:#9bb7ed;color:#101827}

.file-layout{display:grid;grid-template-columns:145px 1fr;gap:13px;height:100%}
.file-side{border-right:1px solid var(--line);padding-right:10px}
.file-side button{
  display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:9px;border-radius:8px;color:#aebbd0;font-size:12px;
}
.file-side button:hover{background:#ffffff10;color:white}
.file-main{min-width:0}
.file-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.file-item{
  background:#ffffff08;border:1px solid var(--line);
  border-radius:10px;padding:12px 8px;text-align:center;min-width:0;
}
.file-item svg{width:25px;height:25px;color:#b9cbed}
.file-item div{font-size:11px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.store-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.store-card{padding:13px;border:1px solid var(--line);background:#ffffff07;border-radius:12px}
.store-icon{
  width:38px;height:38px;border-radius:11px;background:#9bb7ed18;
  display:grid;place-items:center;margin-bottom:10px;
}
.store-icon svg{width:22px;height:22px;color:#c8d9f8}
.store-card p{color:var(--muted);font-size:11px;min-height:30px}

.browser-top{display:flex;gap:7px;margin-bottom:10px}
.browser-top input{flex:1;min-width:0}
.browser-frame{width:100%;height:calc(100% - 48px);border:1px solid var(--line);border-radius:10px;background:white}

.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wall{height:85px;border:2px solid transparent;border-radius:10px;cursor:pointer}
.wall.selected{border-color:#d7e5ff;box-shadow:0 0 0 2px #819fd7}

.toast{
  position:absolute;z-index:1200;right:18px;top:18px;
  background:#182131;border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;box-shadow:var(--shadow);font-size:12px;
}
@media(max-width:650px){
  .desktop-brand{top:18px;left:18px}
  #desktopIcons{top:75px;left:8px;grid-template-columns:repeat(2,72px)}
  .window{
    left:8px!important;top:65px!important;
    width:calc(100vw - 16px)!important;
    height:calc(100dvh - 150px)!important;
    max-width:none;max-height:none;
  }
  .window.maximized{top:8px!important;height:calc(100dvh - 91px)!important}
  .status{gap:6px;padding:0 4px}
  .status .optional{display:none}
  #taskbar{bottom:7px;height:54px;padding:5px 7px;gap:3px}
  .task-app,.start-button{min-width:36px;height:38px}
  .clock{font-size:9px}
  .clock b{font-size:10px}
  .file-layout{grid-template-columns:95px 1fr}
  .file-side button{font-size:10px;padding:8px 5px}
  .window-content{padding:12px}
}
</style>
</head>

<body>
<div id="desktop">

  <div class="desktop-brand">
    <strong>SHADOW<span style="color:#9bb7ed">OS</span></strong>
    <small>PERSONAL DESKTOP ENVIRONMENT</small>
  </div>

  <div id="desktopIcons"></div>
  <div id="windows"></div>

  <div id="startMenu">
    <div class="start-head">
      <strong>SHADOWOS APPLICATIONS</strong>
      <span class="muted">v1.0</span>
    </div>
    <input id="appSearch" class="search" placeholder="Search applications..." oninput="filterApps(this.value)">
    <div class="app-grid" id="appGrid"></div>
  </div>

  <div id="quickPanel">
    <div class="row between" style="margin-bottom:13px">
      <b>Quick Settings</b>
      <span class="muted" id="quickDate"></span>
    </div>
    <div class="quick-grid">
      <button onclick="toast('Network connected')">◉ Network<br><small class="muted">Connected</small></button>
      <button onclick="toggleTheme()">◐ Appearance<br><small class="muted">Dark mode</small></button>
      <button onclick="toast('Focus assist enabled')">☾ Focus assist</button>
      <button onclick="toast('Bluetooth is unavailable in this browser')">ᛒ Bluetooth</button>
    </div>
    <p class="muted" style="font-size:11px">Volume</p>
    <input type="range" min="0" max="100" value="65" style="width:100%">
  </div>

  <div id="taskbar">
    <button class="start-button" title="Start" onclick="toggleStart()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>
      </svg>
    </button>

    <div class="task-divider"></div>
    <div id="taskApps" class="row"></div>
    <div class="task-divider"></div>

    <div class="status">
      <span title="Network">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0m-9 3a5 5 0 0 1 6 0m-3 4h.01"/>
        </svg>
      </span>
      <span class="optional" id="pingLabel">-- ms</span>
      <span class="optional" id="batteryLabel">—%</span>
      <button title="Quick settings" onclick="toggleQuick()">⌄</button>
    </div>

    <div class="clock" id="clock">
      <b>--:--</b>
      <span>--/--/----</span>
    </div>
  </div>
</div>

<script>
const I = {
files:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg>`,
browser:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>`,
calc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 6h8M8 11h2m4 0h2m-8 4h2m4 0h2m-8 3h2m4 0h2"/></svg>`,
store:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h16l-1 12H5L4 8zM3 8l2-5h14l2 5M9 11v2a3 3 0 0 0 6 0v-2"/></svg>`,
settings:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 1.8z"/></svg>`,
music:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
gallery:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`,
terminal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m5 0h5"/></svg>`,
calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>`
};

const APPS=[
  ['files','File Manager'],
  ['browser','Browser'],
  ['calc','Calculator'],
  ['store','App Store'],
  ['settings','Settings'],
  ['music','Music'],
  ['gallery','Gallery'],
  ['terminal','Terminal'],
  ['calendar','Calendar']
];

const winRoot=document.getElementById('windows');
let z=30,active=null,winCount=0;
let files=JSON.parse(localStorage.getItem('shadow_files')||'[]');
let installed=JSON.parse(localStorage.getItem('shadow_apps')||'["files","browser","calc","store","settings"]');

function appIcon(id){return I[id]||I.terminal}

function toast(msg){
  let t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.getElementById('desktop').append(t);
  setTimeout(()=>t.remove(),2600);
}

function toggleStart(){
  document.getElementById('startMenu').classList.toggle('show');
  document.getElementById('quickPanel').classList.remove('show');
}

function toggleQuick(){
  document.getElementById('quickPanel').classList.toggle('show');
  document.getElementById('startMenu').classList.remove('show');
  document.getElementById('quickDate').textContent=new Date().toLocaleDateString('id-ID');
}

function filterApps(q){renderAppGrid(q.toLowerCase())}

function renderAppGrid(q=''){
  document.getElementById('appGrid').innerHTML=APPS
    .filter(a=>a[1].toLowerCase().includes(q))
    .map(a=>`<button class="app-tile" onclick="openApp('${a[0]}');toggleStart()">${appIcon(a[0])}<span>${a[1]}</span></button>`)
    .join('');
}

function renderDesktop(){
  document.getElementById('desktopIcons').innerHTML=APPS.slice(0,5)
    .map(a=>`<button class="desk-icon" onclick="openApp('${a[0]}')">${appIcon(a[0])}<span>${a[1]}</span></button>`)
    .join('');
}

function updateTaskbar(){
  document.getElementById('taskApps').innerHTML=
    [...winRoot.querySelectorAll('.window')].map(w=>
      `<button class="task-app ${w===active?'active':''}" title="${w.dataset.title}" onclick="restoreWindow('${w.id}')">${appIcon(w.dataset.app)}</button>`
    ).join('');
}

function focusWindow(w){
  if(!w)return;
  active=w;
  z++;
  w.style.zIndex=z;
  document.querySelectorAll('.window').forEach(x=>x.classList.toggle('focused',x===w));
  updateTaskbar();
}

function restoreWindow(id){
  let w=document.getElementById(id);
  if(w){w.style.display='flex';focusWindow(w)}
}

function createWindow(app,title,content,width=590,height=410){
  let old=[...winRoot.querySelectorAll('.window')].find(w=>w.dataset.app===app);
  if(old){restoreWindow(old.id);return old}

  let w=document.createElement('section');
  w.className='window';
  w.id='win'+(++winCount);
  w.dataset.app=app;
  w.dataset.title=title;

  w.style.width=`min(${width}px,calc(100vw - 20px))`;
  w.style.height=`min(${height}px,calc(100dvh - 100px))`;
  w.style.left=Math.max(12,Math.min(innerWidth-width-12,100+winCount*24))+'px';
  w.style.top=Math.max(12,Math.min(innerHeight-height-90,65+winCount*20))+'px';

  w.innerHTML=`
    <header class="titlebar">
      <div class="window-title">${appIcon(app)}<span>${title}</span></div>
      <div class="win-actions">
        <button title="Minimize" onclick="minimizeWindow('${w.id}')">−</button>
        <button title="Maximize" onclick="maximizeWindow('${w.id}')">□</button>
        <button class="close" title="Close" onclick="closeWindow('${w.id}')">×</button>
      </div>
    </header>
    <div class="window-content">${content}</div>
    <div class="resize-handle"></div>
  `;

  winRoot.append(w);
  focusWindow(w);
  makeDraggable(w);
  makeResizable(w);
  return w;
}

function closeWindow(id){
  let w=document.getElementById(id);
  if(w)w.remove();
  active=[...winRoot.querySelectorAll('.window')].pop()||null;
  if(active)focusWindow(active);
  else updateTaskbar();
}

function minimizeWindow(id){
  let w=document.getElementById(id);
  if(w)w.style.display='none';
  active=null;
  updateTaskbar();
}

function maximizeWindow(id){
  let w=document.getElementById(id);
  if(!w)return;

  if(w.classList.contains('maximized')){
    w.classList.remove('maximized');
    w.style.left=w.dataset.left;
    w.style.top=w.dataset.top;
    w.style.width=w.dataset.width;
    w.style.height=w.dataset.height;
  }else{
    w.dataset.left=w.style.left;
    w.dataset.top=w.style.top;
    w.dataset.width=w.style.width;
    w.dataset.height=w.style.height;
    w.classList.add('maximized');
  }
  focusWindow(w);
}

function snapWindow(w,side){
  w.classList.remove('maximized');
  w.classList.add('snapped');
  w.style.top='10px';
  w.style.height='calc(100dvh - 91px)';
  w.style.width='calc(50vw - 15px)';
  w.style.left=side==='left'?'10px':'calc(50vw + 5px)';
  focusWindow(w);
}

function makeDraggable(w){
  let bar=w.querySelector('.titlebar');
  let sx,sy,l,t,drag=false;

  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    if(w.classList.contains('maximized'))return;
    drag=true;
    focusWindow(w);
    sx=e.clientX;sy=e.clientY;
    l=w.offsetLeft;t=w.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener('pointermove',e=>{
    if(!drag)return;
    let x=l+e.clientX-sx;
    let y=t+e.clientY-sy;
    w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,x))+'px';
    w.style.top=Math.max(0,Math.min(innerHeight-80,y))+'px';
  });

  bar.addEventListener('pointerup',e=>{
    if(!drag)return;
    drag=false;
    if(e.clientX<18)snapWindow(w,'left');
    else if(e.clientX>innerWidth-18)snapWindow(w,'right');
  });
}

function makeResizable(w){
  let h=w.querySelector('.resize-handle');

  h.addEventListener('pointerdown',e=>{
    e.preventDefault();
    focusWindow(w);

    let sx=e.clientX,sy=e.clientY;
    let sw=w.offsetWidth,sh=w.offsetHeight;

    h.setPointerCapture(e.pointerId);

    let move=ev=>{
      w.style.width=Math.max(280,Math.min(innerWidth-w.offsetLeft,sw+ev.clientX-sx))+'px';
      w.style.height=Math.max(190,Math.min(innerHeight-w.offsetTop-80,sh+ev.clientY-sy))+'px';
    };

    let up=()=>{
      h.removeEventListener('pointermove',move);
      h.removeEventListener('pointerup',up);
    };

    h.addEventListener('pointermove',move);
    h.addEventListener('pointerup',up);
  });
}

function openApp(id){
  let title=(APPS.find(a=>a[0]===id)||[id,id])[1];
  let body='';

  if(id==='calc')body=calcHTML();
  if(id==='files')body=fileHTML();
  if(id==='browser')body=browserHTML();
  if(id==='store')body=storeHTML();
  if(id==='settings')body=settingsHTML();

  if(id==='terminal')body=terminalHTML();

  if(id==='calendar'){
    body=`<h2>Calendar</h2><div class="panel">
      <h1>${new Date().toLocaleDateString('id-ID',{day:'numeric'})}</h1>
      <b>${new Date().toLocaleDateString('id-ID',{weekday:'long',month:'long',year:'numeric'})}</b>
    </div>`;
  }

  if(id==='music'){
    body=`<div style="text-align:center;padding:35px">
      <div style="font-size:48px">♫</div>
      <h2>Shadow Music</h2>
      <p class="muted">Your local music workspace</p>
      <input type="file" accept="audio/*" id="audioFile" class="field">
      <audio id="audioPlayer" controls style="width:100%;margin-top:20px"></audio>
    </div>`;
  }

  if(id==='gallery'){
    body=`<h2>Gallery</h2>
      <p class="muted">Open images from your device.</p>
      <input type="file" accept="image/*" multiple class="field" onchange="previewImages(this)">
      <div id="galleryPreview" class="store-grid" style="margin-top:12px"></div>`;
  }

  let w=createWindow(id,title,body,id==='calc'?370:600,id==='calc'?480:440);

  if(id==='calc')initCalc(w);
  if(id==='files')initFiles(w);
  if(id==='browser')initBrowser(w);
  if(id==='store')initStore(w);
  if(id==='settings')initSettings(w);
  if(id==='terminal')initTerminal(w);

  if(id==='music'){
    let inp=w.querySelector('#audioFile');
    inp.onchange=()=>{
      let a=w.querySelector('#audioPlayer');
      a.src=URL.createObjectURL(inp.files[0]);
    };
  }

  return w;
}

/* CALCULATOR */

function calcHTML(){
  return `<div class="calc">
    <div class="calc-screen">
      <div class="calc-expression" id="calcExpr"></div>
      <div class="calc-value" id="calcValue">0</div>
    </div>
    <div class="calc-grid">
      ${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','=']
        .map((x,i)=>`<button class="${[3,7,11,15].includes(i)?'op':''} ${x==='='?'equal':''}" data-key="${x}">${x}</button>`)
        .join('')}
    </div>
  </div>`;
}

function initCalc(w){
  let v='0',expr='';
  const val=w.querySelector('#calcValue');
  const ex=w.querySelector('#calcExpr');

  function press(k){
    if(k==='AC'){v='0';expr=''}
    else if(k==='⌫'){v=v.length>1?v.slice(0,-1):'0'}
    else if(k==='='){
      try{
        let s=(expr+v).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
        if(!/^[0-9+\-*/%.() ]+$/.test(s))throw 0;
        let n=Function('"use strict";return ('+s+')')();
        if(!Number.isFinite(n))throw 0;
        expr=s+' =';
        v=String(Number(n.toPrecision(11)));
      }catch{
        expr='Invalid expression';
        v='0';
      }
    }
    else if(['+','−','×','÷','%'].includes(k)){expr+=v+k;v='0'}
    else if(k==='±'){v=String(-Number(v))}
    else if(k==='.' ){if(!v.includes('.'))v+='.'}
    else{v=v==='0'?k:v+k}

    val.textContent=v;
    ex.textContent=expr;
  }

  w.querySelectorAll('[data-key]').forEach(b=>{
    b.onclick=()=>press(b.dataset.key);
  });
}

/* FILE MANAGER */

function fileHTML(){
  return `<div class="file-layout">
    <aside class="file-side">
      <p class="section-title">Places</p>
      <button>⌂ Home</button>
      <button>▣ Documents</button>
      <button>▧ Downloads</button>
      <button>☆ Favorites</button>
    </aside>
    <div class="file-main">
      <div class="file-tools">
        <button class="secondary" id="newFolder">＋ Folder</button>
        <button class="secondary" id="newFile">＋ File</button>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>
  </div>`;
}

function initFiles(w){
  let list=w.querySelector('#fileList');

  function draw(){
    list.innerHTML=files.map((f,i)=>`
      <div class="file-item" data-i="${i}">
        ${I.files}
        <div>${escapeHTML(f.name)}</div>
        <small class="muted">${f.type}</small>
      </div>
    `).join('')||'<p class="muted">This folder is empty.</p>';

    list.querySelectorAll('.file-item').forEach(el=>{
      el.onclick=()=>{
        let f=files[+el.dataset.i];
        if(f.type==='File'){
          let name=prompt('Edit file',f.name);
          if(name!==null){
            f.name=name;
            save();
            draw();
          }
        }else toast(f.name+' opened');
      };
    });
  }

  function save(){
    localStorage.setItem('shadow_files',JSON.stringify(files));
  }

  w.querySelector('#newFolder').onclick=()=>{
    let n=prompt('Folder name');
    if(n){files.push({name:n,type:'Folder'});save();draw()}
  };

  w.querySelector('#newFile').onclick=()=>{
    let n=prompt('File name');
    if(n){files.push({name:n,type:'File'});save();draw()}
  };

  draw();
}

/* BROWSER */

function browserHTML(){
  return `<div class="browser-top">
    <input id="browserAddress" class="field" placeholder="Enter website address">
    <button class="primary" id="browserGo">Go</button>
    <button class="secondary" id="browserExternal">↗</button>
  </div>
  <iframe class="browser-frame" id="browserFrame"
    sandbox="allow-forms allow-scripts allow-same-origin allow-popups"
    referrerpolicy="no-referrer"></iframe>
  <p class="muted" style="font-size:10px">
    Some websites block embedded viewing. Use ↗ to open them in a new tab.
  </p>`;
}

function initBrowser(w){
  let input=w.querySelector('#browserAddress');
  let frame=w.querySelector('#browserFrame');

  function go(){
    let u=input.value.trim();
    if(!u)return;
    if(!/^https?:\/\//i.test(u))u='https://'+u;

    try{
      let url=new URL(u);
      if(!['http:','https:'].includes(url.protocol))throw 0;
      input.value=url.href;
      frame.src=url.href;
    }catch{toast('Invalid address')}
  }

  w.querySelector('#browserGo').onclick=go;
  input.onkeydown=e=>{if(e.key==='Enter')go()};

  w.querySelector('#browserExternal').onclick=()=>{
    let u=input.value.trim();
    if(u)window.open(/^https?:\/\//i.test(u)?u:'https://'+u,'_blank','noopener,noreferrer');
  };

  input.value='https://example.com';
}

/* TERMINAL */

function terminalHTML(){
  return `<div style="font-family:ui-monospace,monospace">
    <p style="color:#9bb7ed">ShadowOS Terminal [browser simulation]</p>
    <p class="muted">Type <b>help</b> to view available commands.</p>
    <div id="termOut"></div>
    <div class="row">
      <span style="color:#9bb7ed">user@shadow:~$</span>
      <input id="termInput" style="flex:1;background:transparent;border:0;color:white;outline:0">
    </div>
  </div>`;
}

function initTerminal(w){
  let input=w.querySelector('#termInput');
  let out=w.querySelector('#termOut');
  input.focus();

  input.onkeydown=e=>{
    if(e.key!=='Enter')return;
    let c=input.value.trim();

    let msg={
      help:'help · date · clear · apps · version',
      date:new Date().toString(),
      apps:APPS.map(a=>a[1]).join(', '),
      version:'ShadowOS 1.0'
    }[c]??'Command not found: '+c;

    if(c==='clear')out.innerHTML='';
    else out.innerHTML+=`<p style="margin:6px 0">
      <span style="color:#9bb7ed">$ ${escapeHTML(c)}</span><br>
      ${escapeHTML(msg)}
    </p>`;

    input.value='';
  };
}

/* GALLERY */

function previewImages(inp){
  let target=document.getElementById('galleryPreview');
  target.innerHTML='';

  [...inp.files].forEach(f=>{
    let u=URL.createObjectURL(f);
    let img=document.createElement('img');
    img.src=u;
    img.style.cssText='width:100%;height:120px;object-fit:cover;border-radius:10px';
    target.append(img);
  });
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* STATUS BAR */

function updateClock(){
  let d=new Date();
  document.getElementById('clock').innerHTML=`
    <b>${d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</b>
    <span>${d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'})}</span>
  `;
}

async function updatePing(){
  let label=document.getElementById('pingLabel');

  if(!navigator.onLine){
    label.textContent='Offline';
    return;
  }

  try{
    let start=performance.now();
    await fetch(location.href,{method:'HEAD',cache:'no-store'});
    label.textContent=Math.round(performance.now()-start)+' ms';
  }catch{
    label.textContent='Online';
  }
}

async function battery(){
  if(navigator.getBattery){
    try{
      let b=await navigator.getBattery();
      let set=()=>document.getElementById('batteryLabel').textContent=Math.round(b.level*100)+'%';
      set();
      b.addEventListener('levelchange',set);
    }catch{
      document.getElementById('batteryLabel').textContent='—';
    }
  }else{
    document.getElementById('batteryLabel').textContent='—';
  }
}

function toggleTheme(){
  toast('Dark appearance is active');
}

window.addEventListener('online',()=>toast('Connection restored'));
window.addEventListener('offline',()=>toast('You are offline'));

renderDesktop();
renderAppGrid();
updateClock();
setInterval(updateClock,1000);
updatePing();
setInterval(updatePing,30000);
battery();

document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#startMenu,.start-button')){
    document.getElementById('startMenu').classList.remove('show');
  }

  if(!e.target.closest('#quickPanel,.status button')){
    document.getElementById('quickPanel').classList.remove('show');
  }
});
