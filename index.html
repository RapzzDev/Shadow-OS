
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>ShadowOS</title>

<style>
:root{
  --accent:#8295ff;
  --glass:rgba(15,20,35,.82);
  --line:rgba(255,255,255,.12);
  --text:#f4f6ff;
  --muted:#9ba5bc;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#080b14;
  overflow:hidden;
}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
#desktop{
  position:fixed;inset:0;
  background:
    linear-gradient(90deg,rgba(5,8,18,.38),rgba(5,8,18,.08)),
    url("https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=3840&q=90")
    center/cover no-repeat;
  transition:background .3s;
}
#desktop:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(3,6,15,.08),rgba(3,6,15,.28));
  pointer-events:none;
}
#desktop-content{position:absolute;inset:0;z-index:1}
#desktop-brand{
  position:absolute;
  left:22px;
  bottom:85px;
  right:auto;
  color:rgba(255,255,255,.55);
  font-size:10px;
  letter-spacing:2px;
  text-align:left;
  pointer-events:none;
             }
#desktop-icons{
  position:absolute;top:22px;left:18px;
  display:grid;grid-template-columns:repeat(2,76px);
  gap:14px;
}
.desk-icon{
  width:76px;padding:9px 4px;
  border:1px solid transparent;border-radius:12px;
  background:transparent;text-align:center;
  font-size:11px;color:white;
}
.desk-icon:hover{background:#ffffff20;border-color:#ffffff20}
.desk-icon .emoji{font-size:27px;display:block;margin-bottom:7px}

/* Dashboard */
#dashboard{
  position:absolute;right:22px;top:22px;
  width:min(340px,calc(100vw - 150px));
  display:grid;gap:12px;
}
.widget{
  background:rgba(9,14,28,.55);
  border:1px solid rgba(255,255,255,.13);
  border-radius:18px;padding:17px;
  backdrop-filter:blur(22px);
  box-shadow:0 12px 40px #0002;
}
.widget-label{
  color:var(--muted);font-size:10px;
  letter-spacing:1.5px;text-transform:uppercase;
}
.clock{
  font-size:43px;font-weight:300;
  letter-spacing:-2px;margin-top:5px;
}
.date{color:#c1c9dc;font-size:12px;margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  padding:12px;background:#ffffff09;
  border:1px solid #ffffff0c;border-radius:13px;
}
.stat strong{display:block;font-size:19px;margin-top:8px}
.stat small{font-size:10px;color:var(--muted)}
.progress{
  height:5px;background:#ffffff18;
  border-radius:10px;margin-top:10px;overflow:hidden;
}
.progress i{display:block;height:100%;background:var(--accent);width:50%}
#quick-weather{font-size:13px;margin-top:10px;color:#dce2f4}

/* Taskbar */
#taskbar{
  position:absolute;bottom:12px;left:50%;
  transform:translateX(-50%);
  min-height:57px;padding:7px 12px;
  display:flex;align-items:center;gap:8px;
  background:rgba(10,14,26,.78);
  border:1px solid var(--line);
  border-radius:18px;backdrop-filter:blur(25px);
  box-shadow:0 12px 45px #0005;
  z-index:9000;max-width:calc(100vw - 20px);
}
.task-btn{
  width:42px;height:42px;border:0;
  border-radius:12px;background:transparent;
  font-size:20px;
}
.task-btn:hover,.task-btn.active{background:#ffffff1c}
#task-divider{height:27px;width:1px;background:var(--line)}
#tray{
  position:absolute;right:15px;bottom:85px;
  display:flex;align-items:center;gap:13px;
  color:white;font-size:12px;
  z-index:9001;text-shadow:0 2px 8px #000;
}
#tray button{background:none;border:0;font-size:15px}
#tray-clock{text-align:right;line-height:1.5}

/* Panels */
.panel{
  display:none;position:absolute;z-index:8000;
  bottom:82px;left:50%;transform:translateX(-50%);
  width:min(390px,calc(100vw - 24px));
  padding:18px;border:1px solid var(--line);
  border-radius:20px;background:rgba(12,17,31,.94);
  backdrop-filter:blur(28px);box-shadow:0 15px 50px #0006;
}
.panel.show{display:block}
.panel h3{margin:0 0 15px;font-size:15px}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.panel button,.menu-item{
  background:#ffffff0c;border:1px solid #ffffff10;
  border-radius:12px;padding:12px;text-align:left;
}
.panel button:hover,.menu-item:hover{background:#ffffff20}
#start-menu{
  left:50%;bottom:82px;transform:translateX(-50%);
  width:min(440px,calc(100vw - 20px));
}
#start-search{
  width:100%;padding:12px 14px;
  border:1px solid var(--line);border-radius:12px;
  color:white;background:#ffffff0c;outline:none;
  margin-bottom:14px;
}
#start-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu-item{text-align:center;font-size:11px}
.menu-item span{display:block;font-size:24px;margin-bottom:7px}

/* Windows */
.window{
  position:absolute;top:100px;left:150px;
  width:650px;height:440px;
  min-width:290px;min-height:220px;
  display:flex;flex-direction:column;
  background:rgba(13,18,32,.94);
  border:1px solid #ffffff25;
  border-radius:15px;overflow:hidden;
  box-shadow:0 25px 90px #0008;
  backdrop-filter:blur(25px);
  z-index:100;
}
.window.maximized{
  top:8px!important;left:8px!important;
  width:calc(100% - 16px)!important;
  height:calc(100% - 92px)!important;
}
.titlebar{
  height:43px;flex-shrink:0;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 12px;background:#ffffff08;
  border-bottom:1px solid #ffffff12;
  cursor:move;user-select:none;
}
.window-title{font-size:12px;font-weight:600}
.window-actions{display:flex;gap:6px}
.window-actions button{
  border:0;background:#ffffff0c;
  width:27px;height:26px;border-radius:7px;
}
.window-actions button:hover{background:#ffffff25}
.window-actions .close:hover{background:#bd465a}
.window-body{flex:1;overflow:auto;padding:17px}
.resize-handle{
  position:absolute;right:0;bottom:0;
  width:18px;height:18px;cursor:nwse-resize;
}
.resize-handle:after{
  content:"";position:absolute;right:5px;bottom:5px;
  width:7px;height:7px;border-right:2px solid #ffffff55;
  border-bottom:2px solid #ffffff55;
}
.app-card{
  padding:15px;background:#ffffff09;
  border:1px solid #ffffff10;border-radius:13px;
}
.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.app-card button,.primary{
  background:var(--accent);color:#080b14;
  border:0;border-radius:8px;padding:8px 12px;
  font-weight:600;font-size:11px;margin-top:10px;
}
input,textarea,select{
  background:#ffffff0c;border:1px solid var(--line);
  color:white;border-radius:9px;padding:10px;outline:none;
}
input::placeholder,textarea::placeholder{color:#9ba5bc}
.app-input{width:100%;margin:7px 0}
.muted{color:var(--muted);font-size:12px}
.section-title{font-size:13px;margin:0 0 13px}
.list-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 5px;border-bottom:1px solid #ffffff12;font-size:12px;
}

/* Calculator */
#calc-display{
  width:100%;height:65px;text-align:right;
  font-size:29px;margin-bottom:12px;
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{
  border:1px solid #ffffff12;background:#ffffff0d;
  border-radius:12px;padding:16px 5px;font-size:17px;
}
.calc-grid button:hover{background:#ffffff25}
.calc-grid .operator{color:#aebcff;background:#8295ff20}
.calc-grid .equal{background:var(--accent);color:#080b14}

/* Browser */
.browser-bar{display:flex;gap:7px;margin-bottom:12px}
.browser-bar input{flex:1;min-width:0}
.browser-frame{width:100%;height:calc(100% - 50px);border:0;border-radius:8px;background:white}

/* Store */
.store-icon{font-size:27px;margin-bottom:9px}
#toast{
  position:absolute;right:18px;top:18px;
  z-index:99999;padding:13px 17px;
  border:1px solid var(--line);border-radius:12px;
  background:#121a2c;color:white;font-size:12px;
  opacity:0;transform:translateY(-10px);
  transition:.25s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateY(0)}
#context-note{font-size:10px;color:var(--muted);margin-top:15px}

@media(max-width:650px){
  #dashboard{width:165px;right:10px;top:10px}
  .widget{padding:11px;border-radius:13px}
  .clock{font-size:29px}
  .stats{grid-template-columns:1fr}
  .stat{padding:8px}
  .stat strong{font-size:15px}
  #desktop-icons{grid-template-columns:repeat(2,65px);left:8px;top:10px}
  .desk-icon{width:65px;font-size:10px}
  .window{left:5px;top:65px;width:calc(100% - 10px);height:calc(100% - 155px)}
  #tray{right:10px;bottom:83px}
  #desktop-brand{right:12px;bottom:145px;font-size:8px}
}
</style>
</head>

<body>
<div id="desktop">
<div id="desktop-content">

  <div id="desktop-icons">
    <button class="desk-icon" onclick="openApp('files')"><span class="emoji">📁</span>Files</button>
    <button class="desk-icon" onclick="openApp('browser')"><span class="emoji">🌐</span>Browser</button>
    <button class="desk-icon" onclick="openApp('calculator')"><span class="emoji">🧮</span>Calculator</button>
    <button class="desk-icon" onclick="openApp('store')"><span class="emoji">🛍️</span>App Store</button>
    <button class="desk-icon" onclick="openApp('settings')"><span class="emoji">⚙️</span>Settings</button>
    <button class="desk-icon" onclick="openApp('terminal')"><span class="emoji">⌨️</span>Terminal</button>
  </div>

  <div id="dashboard">
    <div class="widget">
      <div class="widget-label">SHADOWOS / LOCAL TIME</div>
      <div class="clock" id="big-clock">00:00</div>
      <div class="date" id="big-date">Loading date...</div>
    </div>

    <div class="widget">
      <div class="widget-label">SYSTEM OVERVIEW</div>
      <div class="stats" style="margin-top:12px">
        <div class="stat">
          <small>MEMORY</small>
          <strong id="memory-stat">--</strong>
          <div class="progress"><i id="memory-bar"></i></div>
        </div>
        <div class="stat">
          <small>NETWORK</small>
          <strong id="network-stat">Online</strong>
          <div class="progress"><i id="network-bar"></i></div>
        </div>
      </div>
      <div id="quick-weather">🌐 Weather widget: connect a weather API to show live weather.</div>
    </div>

    <div class="widget">
      <div class="widget-label">QUICK ACCESS</div>
      <div class="panel-grid" style="margin-top:12px">
        <button onclick="openApp('calendar')">📅 Calendar</button>
        <button onclick="openApp('music')">🎵 Music</button>
        <button onclick="openApp('gallery')">🖼️ Gallery</button>
        <button onclick="openApp('monitor')">📊 Monitor</button>
      </div>
    </div>
  </div>

  <div id="desktop-brand">
    SHADOW-OS<br>
    CREATED BY RAFKA PRADITHIYA © 2026
  </div>
</div>

<div id="tray">
  <button onclick="togglePanel('quick-panel')" title="Quick settings">◉</button>
  <span id="network-icon">◉</span>
  <span id="battery-icon">🔋</span>
 
</div>

<div id="quick-panel" class="panel">
  <h3>Control Center</h3>
  <div class="panel-grid">
    <button onclick="toggleNetwork()">🌐 Network</button>
    <button onclick="toggleTheme()">◐ Appearance</button>
    <button onclick="openApp('settings')">⚙️ Settings</button>
    <button onclick="openApp('monitor')">📊 System Monitor</button>
    <button onclick="openApp('notifications')">🔔 Notifications</button>
    <button onclick="showToast('ShadowOS is running.')">ⓘ System status</button>
  </div>
  <p class="muted" id="network-detail">Network status: online</p>
</div>

<div id="start-menu" class="panel">
  <h3>ShadowOS</h3>
  <input id="start-search" placeholder="Search applications..." oninput="filterApps(this.value)">
  <div id="start-apps">
    <button class="menu-item" data-name="files" onclick="openApp('files')"><span>📁</span>Files</button>
    <button class="menu-item" data-name="browser" onclick="openApp('browser')"><span>🌐</span>Browser</button>
    <button class="menu-item" data-name="calculator" onclick="openApp('calculator')"><span>➗</span>Calculator</button>
    <button class="menu-item" data-name="store" onclick="openApp('store')"><span>🛍️</span>App Store</button>
    <button class="menu-item" data-name="settings" onclick="openApp('settings')"><span>⚙️</span>Settings</button>
    <button class="menu-item" data-name="terminal" onclick="openApp('terminal')"><span>⌨️</span>Terminal</button>
    <button class="menu-item" data-name="calendar" onclick="openApp('calendar')"><span>📅</span>Calendar</button>
    <button class="menu-item" data-name="gallery" onclick="openApp('gallery')"><span>🖼️</span>Gallery</button>
    <button class="menu-item" data-name="music" onclick="openApp('music')"><span>🎵</span>Music</button>
    <button class="menu-item" data-name="monitor" onclick="openApp('monitor')"><span>📊</span>Monitor</button>
  </div>
  <div id="context-note">SHADOWOS · PERSONAL DESKTOP ENVIRONMENT</div>
</div>

<div id="toast"></div>

<div id="taskbar">
  <button class="task-btn" onclick="togglePanel('start-menu')" title="Start">🎛</button>
  <button class="task-btn" onclick="openApp('files')" title="Files">📁</button>
  <button class="task-btn" onclick="openApp('browser')" title="Browser">🌐</button>
  <button class="task-btn" onclick="openApp('calculator')" title="Calculator">➗</button>
  <button class="task-btn" onclick="openApp('store')" title="Store">🛍️</button>
  <span id="task-divider"></span>
  <div id="task-running" style="display:flex;gap:5px"></div>
</div>
</div>

<script>
const desktop = document.getElementById("desktop");
let topZ = 100;
let networkOnline = navigator.onLine;
let toastTimer;

const apps = {
  files:{name:"File Explorer",icon:"📁"},
  browser:{name:"Shadow Browser",icon:"🌐"},
  calculator:{name:"Calculator",icon:"➗"},
  store:{name:"App Store",icon:"🛍️"},
  settings:{name:"Settings",icon:"⚙️"},
  terminal:{name:"Terminal",icon:"⌨️"},
  calendar:{name:"Calendar",icon:"📅"},
  gallery:{name:"Gallery",icon:"🖼️"},
  music:{name:"Shadow Music",icon:"🎵"},
  monitor:{name:"System Monitor",icon:"📊"},
  notifications:{name:"Notifications",icon:"🔔"}
};

const windows = {};
let fileData = JSON.parse(localStorage.getItem("shadow_files") || "[]");
let notifications = JSON.parse(localStorage.getItem("shadow_notifications") || "[]");

function saveFiles(){
  localStorage.setItem("shadow_files",JSON.stringify(fileData));
}
function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),2600);
}
function notify(message){
  notifications.unshift({message,time:new Date().toLocaleTimeString()});
  notifications=notifications.slice(0,30);
  localStorage.setItem("shadow_notifications",JSON.stringify(notifications));
  showToast(message);
}
function togglePanel(id){
  document.querySelectorAll(".panel").forEach(p=>{
    if(p.id!==id)p.classList.remove("show");
  });
  document.getElementById(id).classList.toggle("show");
}
function filterApps(query){
  document.querySelectorAll("#start-apps .menu-item").forEach(item=>{
    item.style.display=item.dataset.name.includes(query.toLowerCase())?"block":"none";
  });
}
function toggleNetwork(){
  networkOnline=!networkOnline;
  updateNetwork();
  showToast(networkOnline?"Network indicator enabled":"Network indicator disabled");
}
function updateNetwork(){
  document.getElementById("network-stat").textContent=networkOnline?"Online":"Offline";
  document.getElementById("network-icon").textContent=networkOnline?"◉":"○";
  document.getElementById("network-bar").style.width=networkOnline?"100%":"0%";
  document.getElementById("network-detail").textContent="Network status: "+(networkOnline?"online":"offline");
}
function toggleTheme(){
  document.body.classList.toggle("light");
  showToast("Appearance preference toggled");
}

/* Clock */
function updateClock(){
  const now=new Date();
  const time=now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  const date=now.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("big-clock").textContent=time;
  document.getElementById("big-date").textContent=date;
  }
setInterval(updateClock,1000);updateClock();

/* Memory display: browser estimate only */
async function updateMemory(){
  if(performance.memory){
    const used=performance.memory.usedJSHeapSize/1048576;
    const total=performance.memory.jsHeapSizeLimit/1048576;
    const percent=Math.min(100,used/total*100);
    document.getElementById("memory-stat").textContent=Math.round(used)+" MB";
    document.getElementById("memory-bar").style.width=percent+"%";
  }else{
    document.getElementById("memory-stat").textContent="N/A";
  }
}
setInterval(updateMemory,3000);updateMemory();
window.addEventListener("online",()=>{networkOnline=true;updateNetwork()});
window.addEventListener("offline",()=>{networkOnline=false;updateNetwork()});
updateNetwork();

/* Window manager */
function createWindow(id){
  if(windows[id]){
    const old=windows[id];
    old.style.display="flex";
    old.style.zIndex=++topZ;
    return old;
  }

  const win=document.createElement("section");
  win.className="window";
  win.dataset.app=id;
  win.style.zIndex=++topZ;
  win.innerHTML=`
    <div class="titlebar">
      <span class="window-title">${apps[id].icon} ${apps[id].name}</span>
      <div class="window-actions">
        <button data-action="minimize">—</button>
        <button data-action="maximize">□</button>
        <button data-action="close" class="close">×</button>
      </div>
    </div>
    <div class="window-body"></div>
    <div class="resize-handle"></div>
  `;
  document.getElementById("desktop-content").appendChild(win);
  windows[id]=win;

  win.addEventListener("pointerdown",()=>win.style.zIndex=++topZ);

  win.querySelector('[data-action="close"]').onclick=()=>{
    win.remove();delete windows[id];updateRunning();
  };
  win.querySelector('[data-action="minimize"]').onclick=()=>{
    win.style.display="none";updateRunning();
  };
  win.querySelector('[data-action="maximize"]').onclick=()=>{
    win.classList.toggle("maximized");
  };

  makeDraggable(win);
  makeResizable(win);
  updateRunning();
  return win;
}
function makeDraggable(win){
  const bar=win.querySelector(".titlebar");
  let sx,sy,ox,oy,moving=false;
  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    if(win.classList.contains("maximized"))return;
    moving=true;sx=e.clientX;sy=e.clientY;
    ox=win.offsetLeft;oy=win.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove",e=>{
    if(!moving)return;
    win.style.left=Math.max(0,ox+e.clientX-sx)+"px";
    win.style.top=Math.max(0,oy+e.clientY-sy)+"px";
  });
  bar.addEventListener("pointerup",e=>{
    if(!moving)return;
    moving=false;
    if(e.clientX<15)snapWindow(win,"left");
    else if(e.clientX>innerWidth-15)snapWindow(win,"right");
  });
}
function snapWindow(win,side){
  win.classList.remove("maximized");
  win.style.top="10px";
  win.style.width="calc(50% - 15px)";
  win.style.height="calc(100% - 100px)";
  win.style.left=side==="left"?"10px":"calc(50% + 5px)";
}
function makeResizable(win){
  const handle=win.querySelector(".resize-handle");
  let sx,sy,sw,sh,resizing=false;
  handle.addEventListener("pointerdown",e=>{
    if(win.classList.contains("maximized"))return;
    resizing=true;sx=e.clientX;sy=e.clientY;
    sw=win.offsetWidth;sh=win.offsetHeight;
    handle.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  handle.addEventListener("pointermove",e=>{
    if(!resizing)return;
    win.style.width=Math.max(290,sw+e.clientX-sx)+"px";
    win.style.height=Math.max(220,sh+e.clientY-sy)+"px";
  });
  handle.addEventListener("pointerup",()=>resizing=false);
}
function updateRunning(){
  const area=document.getElementById("task-running");
  area.innerHTML="";
  Object.entries(windows).forEach(([id,win])=>{
    const btn=document.createElement("button");
    btn.className="task-btn";
    btn.textContent=apps[id].icon;
    btn.title=apps[id].name;
    btn.onclick=()=>{
      win.style.display="flex";
      win.style.zIndex=++topZ;
    };
    area.appendChild(btn);
  });
}

/* App launcher */
function openApp(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
  const win=createWindow(id);
  const body=win.querySelector(".window-body");
  if(win.dataset.initialized==="true")return;
  win.dataset.initialized="true";

  if(id==="calculator")initCalculator(body);
  if(id==="files")initFiles(body);
  if(id==="browser")initBrowser(body);
  if(id==="store")initStore(body);
  if(id==="settings")initSettings(body);
  if(id==="terminal")initTerminal(body);
  if(id==="calendar")initCalendar(body);
  if(id==="gallery")initGallery(body);
  if(id==="music")initMusic(body);
  if(id==="monitor")initMonitor(body);
  if(id==="notifications")initNotifications(body);
}

/* Calculator */
function initCalculator(body){
  body.innerHTML=`
    <input id="calc-display" value="0" readonly>
    <div class="calc-grid">
      ${["AC","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="].map(x=>
        `<button class="${["÷","×","−","+","="].includes(x)?"operator":""} ${x==="="?"equal":""}" data-key="${x}">${x}</button>`
      ).join("")}
    </div>`;
  const display=body.querySelector("#calc-display");
  let expression="";
  body.querySelectorAll("[data-key]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.key;
      if(key==="AC"){expression="";display.value="0";return}
      if(key==="⌫"){expression=expression.slice(0,-1);display.value=expression||"0";return}
      if(key==="±"){expression=expression.startsWith("-")?expression.slice(1):"-"+expression;display.value=expression;return}
      if(key==="="){
        try{
          const safe=expression.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
          if(!/^[0-9+\-*/%.() ]+$/.test(safe))throw Error();
          const result=Function('"use strict";return ('+safe+')')();
          if(!Number.isFinite(result))throw Error();
          expression=String(Number(result.toFixed(8)));
          display.value=expression;
        }catch{display.value="Error";expression=""}
        return;
      }
      expression+=key;
      display.value=expression;
    };
  });
}

/* File Explorer */
function initFiles(body){
  body.innerHTML=`
    <h3 class="section-title">My Files</h3>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="primary" id="new-file">＋ New file</button>
      <button class="primary" id="new-folder">＋ New folder</button>
    </div>
    <div id="file-list" style="margin-top:15px"></div>`;
  const list=body.querySelector("#file-list");
  function render(){
    list.innerHTML=fileData.length?fileData.map((f,i)=>`
      <div class="list-row">
        <span>${f.type==="folder"?"📁":"📄"} ${escapeHTML(f.name)}</span>
        <span>
          <button data-open="${i}">Open</button>
          <button data-rename="${i}">Rename</button>
          <button data-delete="${i}">×</button>
        </span>
      </div>`).join(""):'<p class="muted">This folder is empty.</p>';
    list.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
      const f=fileData[+b.dataset.open];
      if(f.type==="folder"){showToast("Folder opened: "+f.name);return}
      const content=prompt("Edit file content:",f.content||"");
      if(content!==null){f.content=content;saveFiles();showToast("File saved")}
    });
    list.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{
      const f=fileData[+b.dataset.rename];
      const name=prompt("New name:",f.name);
      if(name){f.name=name;saveFiles();render()}
    });
    list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{
      if(confirm("Delete this item?")){fileData.splice(+b.dataset.delete,1);saveFiles();render()}
    });
  }
  body.querySelector("#new-file").onclick=()=>{
    const name=prompt("File name:");
    if(name){fileData.push({name,type:"file",content:""});saveFiles();render()}
  };
  body.querySelector("#new-folder").onclick=()=>{
    const name=prompt("Folder name:");
    if(name){fileData.push({name,type:"folder"});saveFiles();render()}
  };
  render();
}

/* Escape user-entered file names */
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* Browser */
function initBrowser(body){
  body.innerHTML=`
    <div class="browser-bar">
      <button id="back">←</button>
      <button id="reload">↻</button>
      <input id="browser-url" value="https://example.com" placeholder="Enter website URL">
      <button id="go" class="primary">Go</button>
    </div>
    <iframe class="browser-frame" id="browser-frame" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
    <p class="muted">Some websites block embedded browsing. Use Open externally if a page does not load.</p>
    <button id="external" class="primary">Open externally ↗</button>`;
  const url=body.querySelector("#browser-url");
  const frame=body.querySelector("#browser-frame");
  const go=()=>{
    let value=url.value.trim();
    if(!/^https?:\/\//i.test(value))value="https://"+value;
    try{new URL(value);frame.src=value;url.value=value}
    catch{showToast("Invalid address")}
  };
  body.querySelector("#go").onclick=go;
  url.onkeydown=e=>{if(e.key==="Enter")go()};
  body.querySelector("#reload").onclick=()=>frame.src=frame.src;
  body.querySelector("#back").onclick=()=>{try{frame.contentWindow.history.back()}catch{}};
  body.querySelector("#external").onclick=()=>window.open(url.value,"_blank","noopener");
  go();
}

/* Terminal */
function initTerminal(body){
  body.innerHTML=`
    <div style="font:12px monospace;color:#9db4ff;line-height:1.8" id="terminal-output">
      SHADOWOS TERMINAL [Version 1.1]<br>
      Type <b>help</b> to see available commands.<br><br>
    </div>
    <input class="app-input" id="terminal-input" placeholder="Enter command...">`;
  const input=body.querySelector("#terminal-input");
  const output=body.querySelector("#terminal-output");
  input.onkeydown=e=>{
    if(e.key!=="Enter")return;
    const cmd=input.value.trim().toLowerCase();
    output.innerHTML+="<br>&gt; "+escapeHTML(cmd)+"<br>";
    const commands={
      help:"Available: help, date, time, clear, system, apps",
      date:new Date().toDateString(),
      time:new Date().toLocaleTimeString(),
      system:"ShadowOS 1.1 / Browser-based desktop",
      apps:Object.keys(apps).join(", "),
      clear:""
    };
    if(cmd==="clear")output.innerHTML="";
    else output.innerHTML+=escapeHTML(commands[cmd]||"Command not found.")+"<br>";
    input.value="";
    body.scrollTop=body.scrollHeight;
  };
}

/* Calendar */
function initCalendar(body){
  const now=new Date();
  const first=new Date(now.getFullYear(),now.getMonth(),1).getDay();
  const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  body.innerHTML=`
    <h2 style="font-weight:400">${now.toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</h2>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center">
      ${["Min","Sen","Sel","Rab","Kam","Jum","Sab"].map(d=>`<small class="muted">${d}</small>`).join("")}
      ${Array.from({length:first},()=>"<span></span>").join("")}
      ${Array.from({length:days},(_,i)=>`
        <div style="padding:10px 2px;border-radius:8px;background:${i+1===now.getDate()?"#8295ff":"#ffffff0b"};color:${i+1===now.getDate()?"#080b14":"white"}">
          ${i+1}
        </div>`).join("")}
    </div>`;
}

/* Gallery */
function initGallery(body){
  body.innerHTML=`
    <h3 class="section-title">Local Gallery</h3>
    <p class="muted">Select images from your device. Images are not uploaded.</p>
    <input type="file" id="gallery-input" accept="image/*" multiple class="app-input">
    <div id="gallery-grid" class="app-grid"></div>`;
  const input=body.querySelector("#gallery-input");
  const grid=body.querySelector("#gallery-grid");
  input.onchange=()=>{
    grid.innerHTML="";
    [...input.files].forEach(file=>{
      const url=URL.createObjectURL(file);
      const img=document.createElement("img");
      img.src=url;img.alt=file.name;
      img.style="width:100%;height:120px;object-fit:cover;border-radius:10px";
      grid.appendChild(img);
    });
  };
}

/* Music */
function initMusic(body){
  body.innerHTML=`
    <div style="text-align:center;padding:25px">
      <div style="font-size:65px">🎵</div>
      <h3>Shadow Music</h3>
      <p class="muted">Play audio files from your device.</p>

/* System Monitor */
function initMonitor(body){
  body.innerHTML=`
    <h3 class="section-title">System Monitor</h3>
    <div class="app-grid">
      <div class="app-card"><small class="muted">Browser memory</small><h2 id="mon-memory">--</h2></div>
      <div class="app-card"><small class="muted">Network</small><h2 id="mon-network">--</h2></div>
      <div class="app-card"><small class="muted">Screen</small><h2>${screen.width}×${screen.height}</h2></div>
      <div class="app-card"><small class="muted">Platform</small><h2 style="font-size:14px">${escapeHTML(navigator.platform||"Browser")}</h2></div>
    </div>
    <p class="muted">Resource values are limited to information exposed by your browser. They are not actual device-wide CPU or RAM readings.</p>`;
  const refresh=()=>{
    const memory=performance.memory;
    body.querySelector("#mon-memory").textContent=memory?
      Math.round(memory.usedJSHeapSize/1048576)+" MB":"Unavailable";
    body.querySelector("#mon-network").textContent=navigator.onLine?"Online":"Offline";
  };
  refresh();
  const timer=setInterval(()=>{if(!body.isConnected){clearInterval(timer);return}refresh()},3000);
}

/* Notifications */
function initNotifications(body){
  body.innerHTML=`
    <h3 class="section-title">Notification Center</h3>
    <button class="primary" id="clear-notifications">Clear history</button>
    <div id="notification-list" style="margin-top:12px"></div>`;
  const list=body.querySelector("#notification-list");
  function render(){
    list.innerHTML=notifications.length?notifications.map(n=>`
      <div class="list-row"><span>🔔 ${escapeHTML(n.message)}</span><small class="muted">${escapeHTML(n.time)}</small></div>
    `).join(""):'<p class="muted">No notifications yet.</p>';
  }
  body.querySelector("#clear-notifications").onclick=()=>{
    notifications=[];
    localStorage.setItem("shadow_notifications","[]");
    render();
  };
  render();
}

/* Close panels when clicking outside */
document.addEventListener("pointerdown",e=>{
  if(!e.target.closest(".panel")&&!e.target.closest("#taskbar")&&!e.target.closest("#tray")){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("show"));
  }
});

notify("ShadowOS 1.1 initialized");
