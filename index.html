
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOW OS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
#topbar{height:42px;background:#11151d;border-bottom:1px solid #252b36;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:13px}

.icon span{display:block;font-size:29px;margin-bottom:7px}
#taskbar{height:42px;background:#11151deF;border-top:1px solid #252b36;display:flex;align-items:center;padding:0 12px;gap:15px}
#startBtn{background:#202a38;border:0;color:white;padding:7px 13px;border-radius:5px}

#startMenu button{display:block;width:100%;padding:11px;background:none;color:white;border:0;text-align:left;border-radius:5px}
#startMenu button:active,#startMenu button:hover{background:#29364a}
.window{position:absolute;top:55px;left:8%;width:min(650px,84vw);height:min(440px,65vh);background:#141a24;border:1px solid #394456;border-radius:9px;box-shadow:0 15px 45px #0009;overflow:hidden;z-index:5;display:flex;flex-direction:column}
.window.maximized{inset:5px!important;width:auto!important;height:auto!important}

.titlebar strong{font-size:13px;flex:1}
.controls{display:flex;gap:7px}
.controls button{background:#303b4d;color:white;border:0;border-radius:4px;width:25px;height:24px}

.content{padding:14px;overflow:auto;flex:1}
.hidden{display:none!important}
button{cursor:pointer}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.action{background:#29374a;color:#eee;border:1px solid #3a4b63;padding:8px 11px;border-radius:5px;font-size:12px}
.action:hover{background:#35465e}
#path{font-size:12px;color:#aab8ca;margin:10px 0;padding:9px;background:#0e131c;border-radius:5px;overflow-wrap:anywhere}

input,textarea{background:#0b1018;color:white;border:1px solid #354257;border-radius:5px;padding:9px;width:100%;margin:5px 0}
textarea{resize:vertical;min-height:180px}
#editor{display:none}
#editor textarea{height:220px}
#editorActions{display:flex;gap:8px;margin-top:8px}
.empty{color:#8998aa;text-align:center;padding:35px 10px;font-size:13px}
.note{font-size:13px;line-height:1.6;color:#c4cedb}
  #appTasks{
  display:flex;
  gap:6px;
  overflow-x:auto;
  flex:1;
}

.taskBtn{
  background:#202a38;
  color:#aaa;
  border:1px solid #30394a;
  padding:6px 10px;
  border-radius:5px;
  font-size:11px;
  white-space:nowrap;
}

.taskBtn.active{
  background:#354b68;
  color:white;
  border-color:#607d9f;
}

.window{
  resize:both;
  min-width:230px;
  min-height:150px;
}

.window.activeWindow{
  border-color:#7189aa;
  box-shadow:0 15px 45px #000b;
       }
  .wallpaper-blue{
  background:radial-gradient(ellipse at 70% 70%,#142b48,#070b13 70%)!important;
}
.wallpaper-purple{
  background:radial-gradient(ellipse at 70% 70%,#302044,#090710 70%)!important;
}
.wallpaper-red{
  background:radial-gradient(ellipse at 70% 70%,#421b25,#10080b 70%)!important;
}
.wallpaper-black{
  background:radial-gradient(ellipse at 70% 70%,#181818,#050505 70%)!important;
}
.settingGroup{
  padding:12px 0;
  border-bottom:1px solid #30394a;
}
.settingGroup label{
  display:block;
  font-size:13px;
  margin-bottom:8px;
}
.settingGroup select,
.settingGroup input{
  width:100%;
  }
  .systemCard{
  background:#202938;
  border:1px solid #354257;
  border-radius:7px;
  padding:13px;
  margin:10px 0;
}
.systemCard h4{margin:0 0 8px}
.systemCard p{font-size:12px;color:#bdc9d8}
.toast{
  position:absolute;
  right:15px;
  top:15px;
  z-index:200;
  background:#202b3b;
  border:1px solid #52647d;
  padding:13px;
  border-radius:7px;
  width:min(260px,80%);
  font-size:12px;
  box-shadow:0 8px 25px #0008;
}
.powerMenu{
  position:absolute;
  z-index:150;
  bottom:48px;
  right:10px;
  background:#182130;
  border:1px solid #39475b;
  border-radius:8px;
  padding:10px;
  width:190px;
}
.powerMenu button{
  display:block;
  width:100%;
  padding:10px;
  color:white;
  background:transparent;
  border:0;
  text-align:left;
}
.powerMenu button:hover{background:#2b3a50}
</style>
</head>
<body>

<div id="topbar">
  <strong>◈ SHADOW OS</strong>
  <span id="topDate"></span>
</div>

<main id="desktop">
  <div class="icon" onclick="openApp('computer')"><span>🖥️</span>My Computer</div>
  <div class="icon" onclick="openApp('files')"><span>📁</span>File Manager</div>
  <div class="icon" onclick="openApp('notes')"><span>📝</span>Notes</div>
  <div class="icon" onclick="openApp('calculator')"><span>🧮</span>Calculator</div>
  <div class="icon" onclick="openApp('settings')"><span>⚙️</span>Settings</div>
  <div class="icon" onclick="openApp('about')"><span>◈</span>About</div>
  <div class="icon" onclick="openApp('system')"><span>🖥️</span>System</div>
  <div id="wallpaper">SHADOW</div>
</main>

<div id="taskbar">
  <button id="startBtn" onclick="toggleStart()">◈ Start</button>
  <div id="appTasks"></div>
  <span id="clock"></span>
</div>
  
<div id="startMenu">
  <strong style="display:block;padding:8px 10px">Applications</strong>
  <button onclick="openApp('files');toggleStart()">📁 File Manager</button>
  <button onclick="openApp('notes');toggleStart()">📝 Notes</button>
  <button onclick="openApp('calculator');toggleStart()">🧮 Calculator</button>
  <button onclick="openApp('settings');toggleStart()">⚙️ Settings</button>
  <button onclick="openApp('about');toggleStart()">◈ About</button>
  <button onclick="openApp('system');toggleStart()">🖥️ System</button>
</div>

<script>
const desktop=document.getElementById("desktop");
let highestZ=10;
let currentPath=[];
let editingId=null;

const STORAGE="shadow_os_files_v03";

function initialFiles(){
  return [
    {id:"f1",name:"Documents",type:"folder",parent:"root"},
    {id:"f2",name:"Pictures",type:"folder",parent:"root"},
    {id:"f3",name:"Downloads",type:"folder",parent:"root"},
    {id:"f4",name:"Readme.txt",type:"file",parent:"root",content:"Welcome to SHADOW OS.\n\nThis is your virtual file system."}
  ];
}

function loadFiles(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE));
    return Array.isArray(data)?data:initialFiles();
  }catch(e){return initialFiles()}
}

let files=loadFiles();

function saveFiles(){
  localStorage.setItem(STORAGE,JSON.stringify(files));
}

function makeId(){
  return "file_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
}

function currentParent(){
  return currentPath.length?currentPath[currentPath.length-1]:"root";
}

function getFolder(id){
  return files.find(f=>f.id===id&&f.type==="folder");
}

function openApp(name){
  const old=document.getElementById("window-"+name);
  if(old){
    old.classList.remove("hidden");
    old.style.zIndex=++highestZ;
    return;
  }

  const titles={
    computer:"My Computer",
    files:"File Manager",
    notes:"Notes",
    calculator:"Calculator",
    settings:"Settings",
    about:"About SHADOW OS"
    system:"System Information"
  };

  const win=document.createElement("section");
  win.className="window";
  win.id="window-"+name;
  win.style.zIndex=++highestZ;

  win.innerHTML=`
    <div class="titlebar">
      <strong>${titles[name]}</strong>
      <div class="controls">
        <button onclick="minimizeApp('${name}')">−</button>
        <button onclick="maximizeApp('${name}')">□</button>
        <button class="close" onclick="closeApp('${name}')">×</button>
      </div>
    </div>
    <div class="content" id="content-${name}"></div>
  `;

  desktop.appendChild(win);
  win.addEventListener("pointerdown",()=>{
  focusWindow(win);
});

focusWindow(win);
  dragWindow(win);

  if(name==="files")renderFiles();
  if(name==="computer")renderComputer();
  if(name==="notes")renderNotes();
  if(name==="calculator")renderCalculator();
  if(name==="settings")renderSettings();
  if(name==="about")renderAbout();
  if(name==="system")renderSystem();
}

function closeApp(name){
  document.getElementById("window-"+name)?.remove();
  updateTaskbar();
}

function minimizeApp(name){
  document.getElementById("window-"+name)?.classList.add("hidden");
  updateTaskbar();
}

function maximizeApp(name){
  const win=document.getElementById("window-"+name);
  win.classList.toggle("maximized");
  focusWindow(win);
  }

function dragWindow(win){
  const bar=win.querySelector(".titlebar");
  let dragging=false,offsetX=0,offsetY=0;

  bar.addEventListener("pointerdown",e=>{
    if(e.target.tagName==="BUTTON")return;
    if(win.classList.contains("maximized"))return;
    dragging=true;
    offsetX=e.clientX-win.offsetLeft;
    offsetY=e.clientY-win.offsetTop;
    win.style.zIndex=++highestZ;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    win.style.left=Math.max(0,e.clientX-offsetX)+"px";
    win.style.top=Math.max(0,e.clientY-offsetY)+"px";
  });

  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("pointercancel",()=>dragging=false);
}

function toggleStart(){
  const menu=document.getElementById("startMenu");
  menu.style.display=menu.style.display==="block"?"none":"block";
}

function renderComputer(){
  document.getElementById("content-computer").innerHTML=`
    <h3>My Computer</h3>
    <p class="note">SHADOW OS Virtual System</p>
    <div class="fileitem">💾 <span class="filename">Local Storage</span><small>Browser</small></div>
    <div class="fileitem">📁 <span class="filename">Virtual Files</span><small>${files.length} items</small></div>
    <p class="note">File Manager menggunakan penyimpanan browser, bukan penyimpanan asli perangkat.</p>
  `;
}

function renderFiles(){
  const content=document.getElementById("content-files");
  if(!content)return;

  const parent=currentParent();
  const folder=getFolder(parent);

  content.innerHTML=`
    <div class="toolbar">
      <button class="action" onclick="goBack()">← Back</button>
      <button class="action" onclick="createFolder()">＋ Folder</button>
      <button class="action" onclick="createTextFile()">＋ Text File</button>
      <button class="action" onclick="refreshFiles()">↻ Refresh</button>
    </div>
    <div id="path">📁 ${currentPath.length?currentPath.map(id=>getFolder(id)?.name||"Folder").join(" / "):"Home"}</div>
    <div id="fileList"></div>
    <div id="editor">
      <h3 id="editorTitle">Text Editor</h3>
      <textarea id="fileText" placeholder="Tulis sesuatu..."></textarea>
      <div id="editorActions">
        <button class="action" onclick="saveTextFile()">Save</button>
        <button class="action" onclick="closeEditor()">Cancel</button>
      </div>
    </div>
  `;

  const list=document.getElementById("fileList");
  const children=files.filter(f=>f.parent===parent);

  if(children.length===0){
    list.innerHTML='<div class="empty">Folder ini masih kosong.</div>';
  }else{
    children.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==="folder"?-1:1);

    children.forEach(file=>{
      const item=document.createElement("div");
      item.className="fileitem";

      const icon=document.createElement("span");
      icon.textContent=file.type==="folder"?"📁":"📄";

      const filename=document.createElement("span");
      filename.className="filename";
      filename.textContent=file.name;

      const type=document.createElement("small");
      type.textContent=file.type==="folder"?"Folder":"Text File";

      item.append(icon,filename,type);
      item.addEventListener("click",()=>selectFile(file.id));
      item.addEventListener("dblclick",()=>openFile(file.id));
      list.appendChild(item);
    });
  }
}

function selectFile(id){
  const file=files.find(f=>f.id===id);
  if(!file)return;

  if(file.type==="folder"){
    currentPath.push(file.id);
    renderFiles();
  }else{
    openFile(id);
  }
}

function openFile(id){
  const file=files.find(f=>f.id===id&&f.type==="file");
  if(!file)return;

  editingId=id;
  document.getElementById("fileList").style.display="none";
  document.querySelector("#content-files .toolbar").style.display="none";
  document.getElementById("path").style.display="none";

  const editor=document.getElementById("editor");
  editor.style.display="block";
  document.getElementById("editorTitle").textContent=file.name;
  document.getElementById("fileText").value=file.content||"";
}

function closeEditor(){
  editingId=null;
  renderFiles();
}

function saveTextFile(){
  const file=files.find(f=>f.id===editingId);
  if(!file)return;

  file.content=document.getElementById("fileText").value;
  saveFiles();
  closeEditor();
  alert("File berhasil disimpan.");
}

function createFolder(){
  const name=prompt("Masukkan nama folder:");
  if(!name||!name.trim())return;

  if(files.some(f=>f.parent===currentParent()&&f.name.toLowerCase()===name.trim().toLowerCase())){
    alert("Nama tersebut sudah digunakan.");
    return;
  }

  files.push({
    id:makeId(),
    name:name.trim(),
    type:"folder",
    parent:currentParent()
  });

  saveFiles();
  renderFiles();
}

function createTextFile(){
  const name=prompt("Nama file, contoh: Catatan.txt");
  if(!name||!name.trim())return;

  const filename=name.trim().endsWith(".txt")?name.trim():name.trim()+".txt";

  if(files.some(f=>f.parent===currentParent()&&f.name.toLowerCase()===filename.toLowerCase())){
    alert("Nama tersebut sudah digunakan.");
    return;
  }

  const id=makeId();
  files.push({
    id,
    name:filename,
    type:"file",
    parent:currentParent(),
    content:""
  });

  saveFiles();
  renderFiles();
  openFile(id);
}

function goBack(){
  if(currentPath.length){
    currentPath.pop();
    renderFiles();
  }
}

function refreshFiles(){
  files=loadFiles();
  renderFiles();
}

function renameFile(id){
  const file=files.find(f=>f.id===id);
  if(!file)return;

  const name=prompt("Nama baru:",file.name);
  if(!name||!name.trim())return;

  if(files.some(f=>f.id!==id&&f.parent===file.parent&&f.name.toLowerCase()===name.trim().toLowerCase())){
    alert("Nama tersebut sudah digunakan.");
    return;
  }

  file.name=name.trim();
  saveFiles();
  renderFiles();
}

function deleteFile(id){
  const file=files.find(f=>f.id===id);
  if(!file)return;

  if(!confirm("Hapus "+file.name+"?"))return;

  function removeChildren(parentId){
    files.filter(f=>f.parent===parentId).forEach(child=>{
      if(child.type==="folder")removeChildren(child.id);
      files=files.filter(f=>f.id!==child.id);
    });
  }

  if(file.type==="folder")removeChildren(id);
  files=files.filter(f=>f.id!==id);
  currentPath=currentPath.filter(pathId=>getFolder(pathId));
  saveFiles();
  renderFiles();
}

// Menu tindakan file lewat klik kanan.
document.addEventListener("contextmenu",e=>{
  const item=e.target.closest(".fileitem");
  if(!item||!document.getElementById("window-files"))return;

  const parent=currentParent();
  const visible=files.filter(f=>f.parent===parent);
  const index=[...item.parentElement.children].indexOf(item);
  const file=visible.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==="folder"?-1:1)[index];

  if(!file)return;
  e.preventDefault();

  const choice=prompt(
    file.name+"\n\n1. Buka\n2. Ganti nama\n3. Hapus\n\nMasukkan angka:"
  );

  if(choice==="1")selectFile(file.id);
  if(choice==="2")renameFile(file.id);
  if(choice==="3")deleteFile(file.id);
});

function renderNotes(){
  const content=document.getElementById("content-notes");
  const saved=localStorage.getItem("shadow_notes")||"";

  content.innerHTML=`
    <h3>Notes</h3>
    <textarea id="notesText" placeholder="Tulis catatan...">${saved.replace(/</g,"&lt;")}</textarea>
    <button class="action" onclick="saveNotes()">Save Notes</button>
  `;
}

function saveNotes(){
  localStorage.setItem("shadow_notes",document.getElementById("notesText").value);
  alert("Notes saved.");
}

function renderCalculator(){
  document.getElementById("content-calculator").innerHTML=`
    <h3>Calculator</h3>
    <input id="calcInput" placeholder="Contoh: 12+5*2">
    <button class="action" onclick="calculate()">Calculate</button>
    <p id="calcResult" class="note">Result: -</p>
  `;
}

function calculate(){
  const input=document.getElementById("calcInput").value.trim();
  const result=document.getElementById("calcResult");

  if(!/^[0-9+\-*/().%\s]+$/.test(input)){
    result.textContent="Input tidak valid.";
    return;
  }

  try{
    const value=Function('"use strict";return ('+input+')')();
    result.textContent="Result: "+(Number.isFinite(value)?value:"Error");
  }catch(e){
    result.textContent="Expression error.";
  }
}

function renderSettings(){
  document.getElementById("content-settings").innerHTML=`
    <h3>⚙️ Personalization</h3>

    <div class="settingGroup">
      <label>Desktop Wallpaper</label>
      <select id="wallpaperChoice" onchange="applyAppearance()">
        <option value="black">Shadow Black</option>
        <option value="blue">Midnight Blue</option>
        <option value="purple">Dark Purple</option>
        <option value="red">Crimson Night</option>
      </select>
    </div>

    <div class="settingGroup">
      <label>Wallpaper Text Size</label>
      <input id="wallpaperSize" type="range"
        min="40" max="150" value="110"
        oninput="applyAppearance()">
    </div>

    <div class="settingGroup">
      <label>Wallpaper Text</label>
      <input id="wallpaperText" maxlength="20"
        placeholder="SHADOW"
        oninput="applyAppearance()">
    </div>

    <div class="settingGroup">
      <button class="action" onclick="resetAppearance()">
        Reset Appearance
      </button>
    </div>
  `;

  loadAppearance();
  }

function changeTheme(){
  document.body.style.background=
    document.body.style.background.includes("rgb(12")?"#090b10":"#0c1422";
}

function clearNotes(){
  if(confirm("Hapus semua catatan?")){
    localStorage.removeItem("shadow_notes");
    alert("Notes cleared.");
  }
}

function resetFiles(){
  if(!confirm("Reset semua file virtual?"))return;
  files=initialFiles();
  currentPath=[];
  saveFiles();
  renderFiles();
  alert("Virtual files berhasil direset.");
}

function renderAbout(){
  document.getElementById("content-about").innerHTML=`
    <h2>◈ SHADOW OS</h2>
    <p class="note">Version 0.3</p>
    <p class="note">A browser-based virtual desktop environment.</p>
    <p class="note">Created for experimentation and learning.</p>
  `;
}

function updateTaskbar(){
  const taskbar=document.getElementById("appTasks");
  taskbar.innerHTML="";

  document.querySelectorAll(".window").forEach(win=>{
    const name=win.id.replace("window-","");
    const title=win.querySelector(".titlebar strong").textContent;

    const button=document.createElement("button");
    button.className="taskBtn";
    button.textContent=title;

    if(!win.classList.contains("hidden") &&
       win.style.zIndex==highestZ){
      button.classList.add("active");
    }

    button.onclick=()=>{
      if(win.classList.contains("hidden")){
        win.classList.remove("hidden");
        focusWindow(win);
      }else if(win.style.zIndex==highestZ){
        minimizeApp(name);
      }else{
        focusWindow(win);
      }
      updateTaskbar();
    };

    taskbar.appendChild(button);
  });
}

function focusWindow(win){
  document.querySelectorAll(".window").forEach(w=>{
    w.classList.remove("activeWindow");
  });

  win.classList.remove("hidden");
  win.style.zIndex=++highestZ;
  win.classList.add("activeWindow");

  updateTaskbar();
  }
  
function updateClock(){
  const now=new Date();
  document.getElementById("clock").textContent=
    now.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("topDate").textContent=
    now.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}

function applyAppearance(){
  const desktop=document.getElementById("desktop");
  const wallpaper=document.getElementById("wallpaper");

  const color=document.getElementById("wallpaperChoice").value;
  const size=document.getElementById("wallpaperSize").value;
  const text=document.getElementById("wallpaperText").value;

  desktop.className="";
  desktop.classList.add("wallpaper-"+color);

  wallpaper.style.fontSize=size+"px";
  wallpaper.textContent=text.trim()||"SHADOW";

  const settings={
    color,
    size,
    text
  };

  localStorage.setItem("shadow_appearance",JSON.stringify(settings));
}

function loadAppearance(){
  let settings={color:"black",size:110,text:"SHADOW"};

  try{
    settings=JSON.parse(
      localStorage.getItem("shadow_appearance")
    )||settings;
  }catch(e){}

  document.getElementById("wallpaperChoice").value=settings.color;
  document.getElementById("wallpaperSize").value=settings.size;
  document.getElementById("wallpaperText").value=settings.text;

  applyAppearance();
}

function resetAppearance(){
  localStorage.removeItem("shadow_appearance");
  loadAppearance();
  }
  function renderSystem(){
  const content=document.getElementById("content-system");

  const used=new Blob([
    JSON.stringify(files),
    localStorage.getItem("shadow_notes")||"",
    localStorage.getItem("shadow_appearance")||""
  ]).size;

  const kb=(used/1024).toFixed(2);

  content.innerHTML=`
    <h3>🖥️ System Information</h3>

    <div class="systemCard">
      <h4>SHADOW OS</h4>
      <p>Version: 0.6</p>
      <p>Platform: Web Browser</p>
      <p>Status: Running</p>
    </div>

    <div class="systemCard">
      <h4>💾 Virtual Storage</h4>
      <p>Stored data: ${kb} KB</p>
      <p>Virtual files: ${files.length}</p>
      <p>Storage type: Browser Local Storage</p>
    </div>

    <div class="systemCard">
      <h4>⚙️ System Actions</h4>
      <button class="action" onclick="showNotification('SHADOW OS','System berjalan normal.')">
        Test Notification
      </button>
      <button class="action" onclick="clearTemporaryData()">
        Clear Temporary Data
      </button>
      <button class="action" onclick="showPowerMenu()">
        Power Options
      </button>
    </div>
  `;
}

function showNotification(title,message){
  document.getElementById("systemToast")?.remove();

  const toast=document.createElement("div");
  toast.id="systemToast";
  toast.className="toast";

  const heading=document.createElement("strong");
  heading.textContent=title;

  const body=document.createElement("p");
  body.textContent=message;

  toast.append(heading,body);
  desktop.appendChild(toast);

  setTimeout(()=>toast.remove(),3500);
}

function clearTemporaryData(){
  if(!confirm("Bersihkan data sementara SHADOW OS?"))return;

  showNotification("System Cleaner","Tidak ada data sementara yang perlu dibersihkan.");
}

function showPowerMenu(){
  document.getElementById("powerMenu")?.remove();

  const menu=document.createElement("div");
  menu.id="powerMenu";
  menu.className="powerMenu";

  menu.innerHTML=`
    <button onclick="restartShadow()">↻ Restart SHADOW OS</button>
    <button onclick="showNotification('Power','SHADOW OS masih berjalan di browser.')">⏻ Shut Down</button>
    <button onclick="document.getElementById('powerMenu').remove()">Cancel</button>
  `;

  desktop.appendChild(menu);
}

function restartShadow(){
  if(!confirm("Restart tampilan SHADOW OS?"))return;

  document.querySelectorAll(".window").forEach(win=>win.remove());
  currentPath=[];
  document.getElementById("powerMenu")?.remove();

  showNotification("SHADOW OS","Tampilan berhasil dimulai ulang.");
  }
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
