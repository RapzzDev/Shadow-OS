
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d16">
<title>SHADOW OS 0.2</title>

<style>
:root {
  --bg: #080d16;
  --panel: #111b2a;
  --line: #29394f;
  --text: #eaf0f8;
  --muted: #8b9bb1;
  --accent: #8caeff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

#desktop {
  height: 100dvh;
  position: relative;
  overflow: hidden;
  background: radial-gradient(
    ellipse at 70% 35%,
    #1a2b45,
    #0a111e 55%,
    #070a10
  );
}

.topbar {
  height: 42px;
  background: #070b12cc;
  border-bottom: 1px solid #ffffff12;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  color: var(--muted);
  font-size: 12px;
}

.brand {
  font-weight: bold;
  letter-spacing: 3px;
  color: var(--text);
}

.watermark {
  position: absolute;
  right: 5%;
  top: 22%;
  font-size: clamp(50px, 14vw, 150px);
  font-weight: 900;
  letter-spacing: 12px;
  color: #a8c2ff09;
  pointer-events: none;
}

.desktop-icons {
  position: absolute;
  top: 58px;
  left: 12px;
  display: grid;
  gap: 12px;
}

.desk-icon {
  width: 76px;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 11px;
  padding: 8px 2px;
  border-radius: 8px;
}

.desk-icon:hover {
  background: #ffffff15;
}

.desk-icon b {
  display: block;
  font-size: 27px;
  margin-bottom: 5px;
}

.taskbar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: #080d16ef;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 7px;
  z-index: 150;
}

.taskbar button,
.control {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  border-radius: 7px;
  padding: 9px;
}

.taskbar button:hover,
.taskbar button.active {
  background: #1b293c;
  border-color: var(--line);
}

.start-button {
  color: var(--accent) !important;
  font-weight: bold;
  letter-spacing: 2px;
}

.spacer { flex: 1; }

.clock {
  text-align: right;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

#startMenu {
  display: none;
  position: absolute;
  bottom: 65px;
  left: 10px;
  width: min(320px, calc(100vw - 20px));
  padding: 14px;
  background: #101a29;
  border: 1px solid var(--line);
  border-radius: 12px;
  z-index: 200;
  box-shadow: 0 15px 45px #0009;
}

#startMenu.show { display: block; }

.menu-items {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.menu-items button {
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text);
  padding: 11px;
}

.menu-items button:hover {
  background: #1b293c;
  border-color: var(--line);
}

.window {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(600px, calc(100vw - 22px));
  height: min(440px, calc(100dvh - 120px));
  background: #101925;
  border: 1px solid #354760;
  border-radius: 11px;
  box-shadow: 0 20px 60px #000b;
  z-index: 20;
  overflow: hidden;
  flex-direction: column;
}

.window.open { display: flex; }

.window.maximized {
  inset: 48px 8px 64px;
  width: auto;
  height: auto;
  transform: none;
}

.window-header {
  height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  background: #152235;
  border-bottom: 1px solid var(--line);
  touch-action: none;
}

.window-title {
  flex: 1;
  font-weight: bold;
  font-size: 12px;
}

.window-header button {
  background: #1b2a3e;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 5px;
  width: 26px;
  height: 25px;
}

.window-body {
  padding: 15px;
  overflow: auto;
  flex: 1;
}

.muted { color: var(--muted); }

.note {
  width: 100%;
  height: calc(100% - 28px);
  min-height: 200px;
  resize: none;
  background: #0a111c;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  color: var(--text);
  line-height: 1.6;
  outline: none;
}

.status {
  font-size: 11px;
  color: var(--muted);
  height: 25px;
}

.calc {
  max-width: 320px;
  margin: auto;
}

.display {
  width: 100%;
  height: 58px;
  background: #080e17;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: right;
  padding: 10px;
  font-size: 24px;
  margin-bottom: 9px;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.keys button {
  height: 47px;
  background: #1a293d;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text);
  font-size: 16px;
}

.keys button:hover { background: #2a405e; }
.keys .equals { background: #344f80; }

.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 9px;
}

.file {
  padding: 14px 5px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #142033;
  font-size: 12px;
}

.file strong {
  display: block;
  font-size: 25px;
  margin-bottom: 7px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  gap: 10px;
}

select, .small-button {
  background: #1a293d;
  color: var(--text);
  border: 1px solid var(--line);
  padding: 8px;
  border-radius: 7px;
}

.small-button { margin: 5px 5px 12px 0; }

@media(max-width:500px) {
  .taskbar { height: 53px; padding: 0 5px; }
  .window {
    height: min(460px, calc(100dvh - 110px));
  }
  .desktop-icons { left: 4px; }
  .desk-icon { width: 68px; }
}
</style>
</head>

<body>

<main id="desktop">

  <div class="topbar">
    <span class="brand">SHADOW OS <span class="muted">0.2</span></span>
    <span id="topDate">SYSTEM ONLINE</span>
  </div>

  <div class="watermark">SHADOW</div>

  <div class="desktop-icons">
    <button class="desk-icon" data-app="files">
      <b>▣</b>My Computer
    </button>

    <button class="desk-icon" data-app="notes">
      <b>▤</b>Notes
    </button>

    <button class="desk-icon" data-app="calculator">
      <b>▦</b>Calculator
    </button>

    <button class="desk-icon" data-app="settings">
      <b>⚙</b>Settings
    </button>

    <button class="desk-icon" data-app="about">
      <b>◈</b>About
    </button>
  </div>

  <div id="startMenu">
    <div class="muted" style="margin-bottom:10px">
      APPLICATIONS
    </div>

    <div class="menu-items">
      <button data-app="files">▣ File Manager</button>
      <button data-app="notes">▤ Notes</button>
      <button data-app="calculator">▦ Calculator</button>
      <button data-app="settings">⚙ Settings</button>
      <button data-app="about">◈ About</button>
    </div>
  </div>

  <div class="taskbar">
    <button class="start-button" id="startButton">
      ◈ START
    </button>

    <button data-app="files">▣</button>
    <button data-app="notes">▤</button>
    <button data-app="calculator">▦</button>

    <span class="spacer"></span>

    <div class="clock">
      <div id="clockTime">00:00</div>
      <div id="clockDate">--</div>
    </div>
  </div>

</main>

<script>
const apps = {
  files: ["▣", "My Computer"],
  notes: ["▤", "Notes"],
  calculator: ["▦", "Calculator"],
  settings: ["⚙", "Settings"],
  about: ["◈", "About SHADOW OS"]
};

let zIndex = 30;

function appContent(id) {

  if (id === "notes") {
    return `
      <div class="status" id="savedStatus">
        CATATAN TERSIMPAN DI BROWSER
      </div>

      <textarea
        class="note"
        id="noteInput"
        placeholder="Tulis catatanmu..."
      ></textarea>
    `;
  }

  if (id === "calculator") {
    const keys = [
      "AC","⌫","%","÷",
      "7","8","9","×",
      "4","5","6","−",
      "1","2","3","+",
      "±","0",".","="
    ];

    return `
      <div class="calc">
        <input
          class="display"
          id="calcDisplay"
          value="0"
          readonly
        >

        <div class="keys">
          ${keys.map(key => `
            <button
              data-key="${key}"
              class="${key === '=' ? 'equals' : ''}"
            >${key}</button>
          `).join("")}
        </div>
      </div>
    `;
  }

  if (id === "files") {
    return `
      <p class="muted">SIMULATED STORAGE</p>

      <button class="small-button" id="newFolder">
        ＋ New folder
      </button>

      <button class="small-button" id="refreshFiles">
        ↻ Refresh
      </button>

      <div class="file-grid" id="fileGrid">
        <div class="file"><strong>📁</strong>Documents</div>
        <div class="file"><strong>📁</strong>Pictures</div>
        <div class="file"><strong>📁</strong>Downloads</div>
        <div class="file"><strong>▤</strong>Readme.txt</div>
      </div>

      <p class="muted">
        File Manager masih simulasi dan belum mengakses
        file asli perangkat.
      </p>
    `;
  }

  if (id === "settings") {
    return `
      <div class="row">
        <span>Interface theme</span>

        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="blue">Midnight Blue</option>
        </select>
      </div>

      <div class="row">
        <span>Version</span>
        <span>0.2</span>
      </div>

      <div class="row">
        <span>Notes storage</span>
        <span>Local browser</span>
      </div>

      <button class="small-button" id="clearNotes">
        Clear saved notes
      </button>
    `;
  }

  return `
    <div style="text-align:center;padding:25px">
      <div style="
        font-size:42px;
        color:var(--accent);
        font-weight:900;
        letter-spacing:8px
      ">SHADOW</div>

      <h3>OPERATING ENVIRONMENT</h3>

      <p class="muted">Version 0.2 · Web Edition</p>

      <p class="muted">
        Desktop interface berbasis HTML, CSS, dan JavaScript.
        Bukan sistem operasi sungguhan.
      </p>
    </div>
  `;
}

function launchApp(id) {

  if (!apps[id]) return;

  document.getElementById("startMenu")
    .classList.remove("show");

  let win = document.getElementById("window-" + id);

  if (!win) {

    win = document.createElement("section");
    win.className = "window";
    win.id = "window-" + id;

    win.innerHTML = `
      <div class="window-header">
        <span>${apps[id][0]}</span>

        <span class="window-title">
          ${apps[id][1]}
        </span>

        <button data-minimize>—</button>
        <button data-maximize>□</button>
        <button data-close>×</button>
      </div>

      <div class="window-body">
        ${appContent(id)}
      </div>
    `;

    document.getElementById("desktop")
      .appendChild(win);

    win.addEventListener("pointerdown", () => {
      win.style.zIndex = ++zIndex;
    });

    win.querySelector("[data-close]").onclick = () => {
      win.classList.remove("open");
    };

    win.querySelector("[data-minimize]").onclick = () => {
      win.classList.remove("open");
    };

    win.querySelector("[data-maximize]").onclick = () => {
      win.classList.toggle("maximized");
    };

    makeDraggable(win);

    if (id === "notes") setupNotes(win);
    if (id === "calculator") setupCalculator(win);
    if (id === "files") setupFiles(win);
    if (id === "settings") setupSettings(win);
  }

  win.classList.add("open");
  win.style.zIndex = ++zIndex;
}

function setupNotes(win) {

  const input = win.querySelector("#noteInput");
  const status = win.querySelector("#savedStatus");

  input.value = localStorage.getItem("shadow_notes") || "";

  input.addEventListener("input", () => {

    localStorage.setItem("shadow_notes", input.value);

    status.textContent = "SAVING...";

    clearTimeout(input.saveTimer);

    input.saveTimer = setTimeout(() => {
      status.textContent = "SAVED LOCALLY";
    }, 350);

  });
}

function setupCalculator(win) {

  const display = win.querySelector("#calcDisplay");

  let expression = "";

  win.querySelectorAll("[data-key]").forEach(button => {

    button.onclick = () => {

      const key = button.dataset.key;

      if (key === "AC") {
        expression = "";
        display.value = "0";
        return;
      }

      if (key === "⌫") {
        expression = expression.slice(0, -1);
        display.value = expression || "0";
        return;
      }

      if (key === "±") {
        expression = expression.startsWith("-")
          ? expression.slice(1)
          : "-" + expression;

        display.value = expression || "0";
        return;
      }

      if (key === "=") {

        try {

          const safe = expression
            .replace(/×/g, "*")
            .replace(/÷/g, "/")
            .replace(/−/g, "-");

          if (!/^[0-9+\-*/%.() ]+$/.test(safe)) {
            throw new Error("Invalid");
          }

          const result = Function(
            '"use strict";return (' + safe + ')'
          )();

          if (!Number.isFinite(result)) {
            throw new Error("Invalid result");
          }

          expression = String(
            Number(result.toFixed(8))
          );

          display.value = expression;

        } catch {
          expression = "";
          display.value = "Error";
        }

        return;
      }

      expression += ({
        "×": "*",
        "÷": "/",
        "−": "-"
      }[key] || key);

      display.value = expression
        .replace(/\*/g, "×")
        .replace(/\//g, "÷")
        .replace(/-/g, "−");

    };

  });
}

function setupFiles(win) {

  win.querySelector("#newFolder").onclick = () => {

    const name = prompt("Nama folder baru:");

    if (!name) return;

    const folder = document.createElement("div");
    folder.className = "file";

    const icon = document.createElement("strong");
    icon.textContent = "📁";

    folder.append(icon, document.createTextNode(name));

    win.querySelector("#fileGrid").appendChild(folder);
  };

  win.querySelector("#refreshFiles").onclick = () => {
    alert("Tampilan diperbarui.");
  };
}

function setupSettings(win) {

  const theme = win.querySelector("#themeSelect");

  theme.value = localStorage.getItem("shadow_theme") || "dark";

  theme.onchange = () => {
    document.documentElement.dataset.theme = theme.value;
    localStorage.setItem("shadow_theme", theme.value);
  };

  win.querySelector("#clearNotes").onclick = () => {

    if (confirm("Hapus semua catatan tersimpan?")) {
      localStorage.removeItem("shadow_notes");
      alert("Catatan dihapus.");
    }

  };
}

function makeDraggable(win) {

  const header = win.querySelector(".window-header");

  let startX, startY, left, top, dragging = false;

  header.addEventListener("pointerdown", event => {

    if (
      event.target.closest("button") ||
      win.classList.contains("maximized")
    ) return;

    const rect = win.getBoundingClientRect();

    startX = event.clientX;
    startY = event.clientY;
    left = rect.left;
    top = rect.top;

    dragging = true;
    header.setPointerCapture(event.pointerId);
  });

  header.addEventListener("pointermove", event => {

    if (!dragging) return;

    const x = Math.max(
      0,
      Math.min(innerWidth - win.offsetWidth,
        left + event.clientX - startX)
    );

    const y = Math.max(
      42,
      Math.min(innerHeight - 80,
        top + event.clientY - startY)
    );

    win.style.left = x + "px";
    win.style.top = y + "px";
    win.style.transform = "none";
  });

  header.addEventListener("pointerup", () => {
    dragging = false;
  });

  header.addEventListener("pointercancel", () => {
    dragging = false;
  });
}

document.addEventListener("click", event => {

  const appButton = event.target.closest("[data-app]");

  if (appButton) {
    launchApp(appButton.dataset.app);
  }

});

document.getElementById("startButton").onclick = () => {
  document.getElementById("startMenu")
    .classList.toggle("show");
};

document.addEventListener("click", event => {

  if (
    !event.target.closest("#startMenu") &&
    !event.target.closest("#startButton")
  ) {
    document.getElementById("startMenu")
      .classList.remove("show");
  }

});

function updateClock() {

  const now = new Date();

  document.getElementById("clockTime").textContent =
    now.toLocaleTimeString("id-ID", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("clockDate").textContent =
    now.toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

  document.getElementById("topDate").textContent =
    now.toLocaleDateString("id-ID", {
      weekday: "short",
      day: "numeric",
      month: "short"
    });

}

updateClock();
setInterval(updateClock, 1000);

if (localStorage.getItem("shadow_theme") === "blue") {
  document.documentElement.dataset.theme = "blue";
}

</script>

<style>
:root[data-theme="blue"] {
  --bg: #050b18;
  --line: #263d5e;
  --accent: #73c9ff;
}
</style>

</body>
</html>
